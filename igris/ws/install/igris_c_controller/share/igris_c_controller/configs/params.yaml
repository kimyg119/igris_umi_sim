        # Gravity compensation shaping parameters, consumed only when
        # igris_c.controller.GravityCompensationModule.enabled == true.
        # The final torque path has three gates:
        # 1) module enable flag in robot.yaml
        # 2) per-joint gain/offset here
        # 3) runtime suppression on motor error, plus low torso-kp suppression
        #    in the bridge-command path
        #
        # gravity_comp_gain scales the raw RBDL gravity torque per system joint.
        # 0.0 disables gravity compensation on that joint even if the module is enabled.
