# replay-q LowCmd gains, SDK PJS coordinates. Loaded once per CLI invocation.
# Edit and restart replay-q to apply; existing motion never hot-reloads this file.
# Vendor real profile scaled: kp_real x5, kd_real x2.
# Source: igris/configs/controller/params.yaml.
# Kd <= 5 in this replay profile, per operator constraint.
# igris_core validates finite non-negative Kp, without treating presets as vendor ceilings.
# Legs and neck are intentionally excluded; their outgoing Kp/Kd remain zero.

[motion.gains.waist_yaw]
kp = 250.0
kd = 4.0

[motion.gains.waist_roll]
kp = 250.0
kd = 4.0

[motion.gains.waist_pitch]
